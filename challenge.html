<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening Challenge — SosaSpins</title>
  <link rel="icon" type="image/png" href="../assets/images/homepics/Sosa-Icon-V3.png">
  <link rel="stylesheet" href="/assets/css/challenge.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header with Admin Lock -->
  <header id="siteHeader">
    <div class="nav container">
            <!-- Logo -->
            <a href="index.html" class="nav-logo-link">
                <img src="assets/images/homepics/Sosa-Icon-V3.png" alt="SosaSpeaks Icon" class="logo-icon">
            </a>
            <div class="nav-right-group">
              <button type="button" id="adminTriggerBtn" class="aero-btn" title="Admin Mode">
                  <img
                    id="adminLockIcon"
                    src="assets/images/homepics/CP070.ico"
                    alt="Admin Status"
                    class="aero-lock-icon nav-custom-icon"
                  />
                </button>
                <a href="about.html" class="nav-custom-link" title="About">
                    <img src="assets/images/homepics/msgsres_1.ico" class="nav-custom-icon msngr-icon" alt="About">
                </a>
                <i class='bx bx-moon theme-toggle' style="scale: 155%;" title="Theme"></i>
            </div>
        </div>
  </header>

  <!-- Banner -->
  <section class="main-home spins-hero" id="main-home">
    <div class="home-text container">
      <h1 class="home-title">Sosa's Backlog</h1>
      <span class="home-subtitle" id="progressSubtitle">October 7×7 Listening Challenge (49 Albums)</span>
    </div>
  </section>

<!-- Month Tabs & Progress Header -->
  <div class="challenge-controls container">
    <div class="challenge-actions-bar">

      <!-- Left side: The Tabs + The Add Button sitting flush together -->
      <div class="tabs-and-actions-left" style="display: flex; align-items: flex-end; gap: 4px;">
        <menu role="tablist" class="w7-month-tabs" id="monthTabsList">
          <button type="button" role="tab" class="active" aria-selected="true" data-month="october">October (49/49)</button>
          <button type="button" role="tab" aria-selected="false" data-month="november">November (0/49)</button>
        </menu>

        <!-- Admin New Month Button: Aligns perfectly to the bottom border baseline -->
        <button type="button" id="addNewMonthBtn" class="aero-add-tab-btn admin-only" style="display: none;" title="Create New Month Challenge">
          + New Month
        </button>
      </div>

    </div>


    <!-- Authentic Windows 7 Progress Bar with Animated Sweep -->
    <div class="challenge-progress-box">
      <div class="progress-labels">
        <span id="completedCounter">Completed: 0 / 49</span>
        <span id="completedPercent">0%</span>
      </div>
      <div class="progress-bar-track" role="progressbar">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>
  </div>

  <!-- STANDALONE VISTA / 7 GRID WINDOW -->
  <main class="challenge-container container">
    <div class="window glass grid-window-frame" id="gridWindowFrame">
      <!-- Window Title Bar: Clean Title Only -->
      <div class="title-bar">
        <div class="title-bar-text">
          <i class='bx bx-disc' style="margin-right: 4px; vertical-align: middle;"></i>
          SosaSpins Challenge Explorer
        </div>
      </div>

      <!-- Attached Vista Command Bar / Controls Bar -->
      <div class="window-command-bar">
        <div class="command-group-left">
          <button type="button" id="gridSizeBtn" class="aero-command-btn" title="Cycle grid layout size">
            <i class='bx bx-grid-alt'></i> Size: Standard
          </button>
          <button type="button" id="exportImageBtn" class="aero-command-btn export-emerald-btn" title="Download Topster image">
            <i class='bx bx-camera'></i> Export Image
          </button>
          <!-- Upload Unfinished Backlog Covers to Supabase Storage -->
          <button type="button" id="syncBacklogCoversBtn" class="aero-command-btn sync-cloud-btn admin-only" style="display: none;" title="Upload all external backlog artwork directly to Supabase storage">
            <i class='bx bx-cloud-upload'></i> Sync Art to Cloud
          </button>
        </div>
        <div class="command-group-right">
          <button type="button" id="openAddModalBtn" class="aero-command-btn add-emerald-btn admin-only" style="display: none;">
            <i class='bx bx-plus'></i> Add Album
          </button>
        </div>
      </div>

      <!-- Window Body (Recessed Clean Background for the 7x7 Grid) -->
      <div class="window-body grid-window-body">
        <div id="exportWrapper" class="export-capture-zone">
          <div class="topster-grid size-standard" id="topsterGrid">
            <!-- Indeterminate Marquee Loader -->
            <div class="w7-loading-wrapper">
              <span class="w7-loading-text">Connecting to SosaSpins database...</span>
              <div class="progress-bar-track marquee" role="progressbar"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Window Status Bar Footer -->
      <div class="status-bar">
        <div class="status-bar-field" id="statusBarSelection">49 items</div>
        <div class="status-bar-field" style="text-align: right; max-width: 140px;">Ready</div>
      </div>

    </div>
  </main>

  <!-- DETAIL MODAL: Authentic Windows 7 Glass Window -->
  <div id="detailModal" class="sosa-modal-backdrop" style="display: none;">
    <div class="window glass w7-modal-window">
      <div class="title-bar">
        <div class="title-bar-text">Album Details</div>
        <div class="title-bar-controls">
          <button type="button" id="closeDetailModal" aria-label="Close" class="is-close"></button>
        </div>
      </div>
      <div class="window-body" id="modalAlbumBody"></div>
    </div>
  </div>

  <!-- ADMIN ADD / EDIT MODAL: Windows 7 Glass Window -->
  <div id="addModal" class="sosa-modal-backdrop" style="display: none;">
    <div class="window glass w7-modal-window">
      <div class="title-bar">
        <div class="title-bar-text" id="addModalTitleText">Manage Backlog Entry</div>
        <div class="title-bar-controls">
          <button type="button" id="closeAddModal" aria-label="Close" class="is-close"></button>
        </div>
      </div>
      <!-- ADMIN ADD / EDIT MODAL: Windows 7 Glass Window -->
      <form id="addAlbumForm" class="window-body" style="display: flex; flex-direction: column; gap: 0.85rem; padding: 1.25rem;">
        <input type="hidden" id="editEntryId" value="">

        <!-- Top Section: Locked Square Preview + Inputs -->
        <div class="add-album-top-row">
          <div class="w7-preview-box">
              <img
                id="addPreviewImg"
                src="../assets/images/spins/placeholder.png"
                alt="Artwork Preview"
                onerror="this.onerror=null; this.src='../assets/images/spins/placeholder.png';">
            </div>
          <div class="add-album-inputs-group">
          <input type="text" id="addArtist" class="sosa-search-input" placeholder="Artist" required>
          <input type="text" id="addTitle" class="sosa-search-input" placeholder="Album Title" required>
          <input
            type="number"
            id="addReleaseYear"
            class="sosa-search-input"
            placeholder="Release Year (YYYY)"
            min="1900"
            max="2099">

          <div class="modal-btn-row">
            <button type="button" id="fetchCoverBtn" class="aero-btn-action">
              <i class='bx bx-image'></i> Fetch Art
            </button>
            <button type="button" id="fetchSpinCoverBtn" class="aero-btn-action">
              <i class='bx bx-disc'></i> Get Spin Cover
            </button>
            <button type="button" id="fetchRuntimeBtn" class="aero-btn-action">
              <i class='bx bx-time'></i> Fetch Runtime
            </button>
          </div>
        </div>
      </div>

        <!-- Cover Selector Carousel -->
        <div id="artCandidatesContainer" class="art-candidates-picker" style="display: none;">
          <span class="picker-label">Select Artwork:</span>
          <div id="artThumbnailsRow" class="thumbnails-scroll-row"></div>
        </div>

        <input type="text" id="addRuntime" class="sosa-search-input" placeholder="Runtime (e.g. 42m 15s)">
        <input type="text" id="addCoverUrl" class="sosa-search-input" placeholder="Cover URL">
       <!-- Primary Genres Tag Box -->
        <div class="tag-field-row">
          <div class="tag-input-box" id="genresTagBox">
            <input type="text" id="addGenresInput" class="tag-inline-input" placeholder="Add Primary Genre..." autocomplete="off">
          </div>
          <div class="aero-autocomplete-menu" id="genresDropdown" style="display: none;"></div>
        </div>
        <input type="hidden" id="addGenres" value="">

        <!-- Secondary Genres Tag Box -->
        <div class="tag-field-row">
          <div class="tag-input-box" id="secondaryGenresTagBox">
            <input type="text" id="addSecondaryGenresInput" class="tag-inline-input" placeholder="Add Secondary Genre..." autocomplete="off">
          </div>
          <div class="aero-autocomplete-menu" id="secondaryGenresDropdown" style="display: none;"></div>
        </div>
        <input type="hidden" id="addSecondaryGenres" value="">

        <!-- Descriptors Tag Box -->
        <div class="tag-field-row">
          <div class="tag-input-box" id="descriptorsTagBox">
            <input type="text" id="addDescriptorsInput" class="tag-inline-input" placeholder="Add Descriptor..." autocomplete="off">
          </div>
          <div class="aero-autocomplete-menu" id="descriptorsDropdown" style="display: none;"></div>
        </div>
        <input type="hidden" id="addDescriptors" value="">

        <button type="submit" id="submitAddAlbumBtn" class="aero-btn-action primary-save-btn">
          Save to Backlog
        </button>
      </form>
    </div>
  </div>

  <footer class="footer container">
    <p class="footer-copyright">&#169; Sosa Speaks / SosaSpins, All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/challenge.js"></script>
</body>
</html>
