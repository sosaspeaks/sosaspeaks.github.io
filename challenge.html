<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening Challenge — SosaSpins</title>
  <link rel="icon" type="image/png" href="../assets/images/homepics/Sosa-Icon-V3.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/challenge.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header with Admin Lock -->
  <header id="siteHeader">
    <div class="nav container">
            <!-- Logo -->
            <a href="index.html" class="nav-logo-link">
                <img src="assets/images/homepics/Sosa-Icon-V3.png" alt="SosaSpeaks Icon" class="logo-icon">
            </a>
            <div class="nav-right-group">
              <button type="button" id="adminTriggerBtn" class="aero-btn" title="Admin Mode">
                  <img
                    id="adminLockIcon"
                    src="assets/images/homepics/CP070.ico"
                    alt="Admin Status"
                    class="aero-lock-icon nav-custom-icon"
                  />
                </button>
                <a href="about.html" class="nav-custom-link" title="About">
                    <img src="assets/images/homepics/msgsres_1.ico" class="nav-custom-icon msngr-icon" alt="About">
                </a>
                <i class='bx bx-moon theme-toggle' style="scale: 155%;" title="Theme"></i>
            </div>
        </div>
  </header>

  <!-- Banner -->
  <section class="main-home spins-hero" id="main-home">
    <div class="home-text container">
      <h1 class="home-title">Sosa's Backlog</h1>
      <span class="home-subtitle" id="progressSubtitle">October 7×7 Listening Challenge (49 Albums)</span>
    </div>
  </section>

  <!-- Month Controls & Action Row -->
  <div class="challenge-controls container">
    <div class="challenge-actions-bar">
      <div class="post-filter">
        <button type="button" class="filter-item active-filter" data-month="october">October (49)</button>
        <button type="button" class="filter-item" data-month="november">November (49)</button>
      </div>

      <!-- Grid Utilities: Size Toggle & Image Export -->
      <div class="challenge-toolbar-actions">
        <!-- 3-Way Grid Sizer Button -->
        <button type="button" id="gridSizeBtn" class="filter-item" title="Cycle grid layout size">
          <i class='bx bx-grid-alt'></i> Size: Standard
        </button>
        <!-- Picture Export Button -->
        <button type="button" id="exportImageBtn" class="filter-item export-btn" title="Download Topster image">
          <i class='bx bx-camera'></i> Export Image
        </button>
        <!-- Admin-Only Button to Add Albums -->
        <button type="button" id="openAddModalBtn" class="filter-item admin-only" style="display: none; border-color: #10b981; color: #10b981;">
          + Add Album
        </button>
      </div>
    </div>

    <!-- Progress Indicator -->
    <div class="challenge-progress-box">
      <div class="progress-labels">
        <span id="completedCounter">Completed: 0 / 49</span>
        <span id="completedPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>
  </div>

  <!-- 7x7 Grid Container -->
  <main class="challenge-container container">
    <!-- Inner export-wrapper for clean border snapshots -->
    <div id="exportWrapper" class="export-capture-zone">
      <div class="topster-grid size-standard" id="topsterGrid">
        <div class="grid-loader">Connecting to SosaSpins database...</div>
      </div>
    </div>
  </main>

  <!-- DETAIL MODAL: Clean Header with Close Button -->
  <div id="detailModal" class="sosa-modal-backdrop" style="display: none;">
    <div class="modal-dialog challenge-modal-dialog">
      <div class="modal-header" style="justify-content: flex-end; padding: 0.75rem 1rem; border-bottom: none;">
        <button type="button" id="closeDetailModal" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modalAlbumBody" style="padding-top: 0;"></div>
    </div>
  </div>

  <!-- Admin Add / Edit Modal -->
  <div id="addModal" class="sosa-modal-backdrop" style="display: none;">
    <div class="modal-dialog challenge-modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="addModalTitle">Add Album to Challenge</h3>
        <button type="button" id="closeAddModal" class="modal-close-btn">&times;</button>
      </div>
      <form id="addAlbumForm" class="modal-body" style="display: flex; flex-direction: column; gap: 1rem; padding: 1.25rem;">
        <input type="hidden" id="editEntryId" value="">
        <div style="display: flex; gap: 1rem;">
          <div style="width: 90px; height: 90px; background: #fff; border-radius: 8px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,0.1);">
            <img id="addPreviewImg" src="placeholder.png" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://placehold.co/100?text=Preview'">
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
            <input type="text" id="addArtist" class="sosa-search-input" placeholder="Artist" required>
            <input type="text" id="addTitle" class="sosa-search-input" placeholder="Album Title" required>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <button type="button" id="fetchCoverBtn" class="filter-item" style="padding: 4px 8px; font-size: 0.75rem;">Fetch Art</button>
              <button type="button" id="fetchSpinCoverBtn" class="filter-item" style="padding: 4px 8px; font-size: 0.75rem; border-color: #10b981; color: #10b981;">Get Spin Cover</button>
              <button type="button" id="fetchRuntimeBtn" class="filter-item" style="padding: 4px 8px; font-size: 0.75rem;">Fetch Runtime</button>
            </div>
          </div>
        </div>

        <div id="artCandidatesContainer" class="art-candidates-picker" style="display: none;">
          <span class="picker-label">Select Artwork:</span>
          <div id="artThumbnailsRow" class="thumbnails-scroll-row"></div>
        </div>

        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="addRuntime" class="sosa-search-input" placeholder="Runtime (e.g. 42 min)" style="width: 100%;">
        </div>

        <input type="text" id="addCoverUrl" class="sosa-search-input" placeholder="Cover URL">

        <button type="submit" id="submitAddAlbumBtn" class="filter-item active-filter" style="width: 100%; margin-top: 0.5rem;">
          Save to Backlog
        </button>
      </form>
    </div>
  </div>

  <footer class="footer container">
    <p class="footer-copyright">&#169; Sosa Speaks / SosaSpins, All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/challenge.js"></script>
</body>
</html>
